# Miniaturas dos arquivos .gdr no Explorador do Windows (GD-GDR-12): DLL
# de extensão do shell (IThumbnailProvider) que mostra a imagem guardada em
# thumbnails/page-1.png. Fora do Windows o crate fica vazio.
[package]
name = "graphdraw-thumbs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
graphdraw-core = { path = "../graphdraw-core" }

[target.'cfg(windows)'.dependencies]
png = "0.18.1"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
