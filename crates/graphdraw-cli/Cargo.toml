[package]
name = "graphdraw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linha de comando do GraphDraw (graphdraw convert)"

[[bin]]
name = "graphdraw"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
graphdraw-core = { version = "0.1.0", path = "../graphdraw-core" }
serde_json = "1.0.154"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3.27.0"
