[package]
name = "graphdraw-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Núcleo do GraphDraw: modelo de documento, .gdr, importação .cdr, renderização e exportação"

[dependencies]
base64 = "0.23.1"
fontdb = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "gif"] }
kurbo = "0.13.1"
miniz_oxide = "0.9.1"
pdf-writer = "0.15.0"
png = "0.18.1"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
roxmltree = "0.21.1"
tempfile = "3.27.0"
