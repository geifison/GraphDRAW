[package]
name = "graphdraw-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aplicativo gráfico do GraphDraw (editor)"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
graphdraw-core = { version = "0.1.0", path = "../graphdraw-core" }
kurbo = "0.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
png = "0.18.1"
