[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cdr",
    "crates/io",
    "crates/text",
    "crates/render",
    "crates/vba",
    "crates/vba-project",
    "apps/graphdraw",
    "apps/graphdraw-cli",
]

[workspace.package]
version = "0.9.4"
edition = "2021"
authors = ["Ighor Toth", "GraphDraw contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/geifison/GraphDRAW"
homepage = "https://github.com/geifison/GraphDRAW"
rust-version = "1.80"

[workspace.dependencies]
graphdraw-core = { path = "crates/core" }
graphdraw-cdr = { path = "crates/cdr" }
graphdraw-io = { path = "crates/io" }
graphdraw-text = { path = "crates/text" }
graphdraw-render = { path = "crates/render" }
graphdraw-vba = { path = "crates/vba" }
graphdraw-vba-project = { path = "crates/vba-project" }

kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = "0.12"
fontdb = "0.24"
ttf-parser = "0.25"
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
zip = { version = "4", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# The browser build (wasm32): size matters more than the last percent of speed.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
