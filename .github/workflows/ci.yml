name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      GRAPHDRAW_REQUIRE_BRIDGE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libcdr
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-nsis
      - name: Ponte libcdr (gd-cdr-bridge)
        shell: msys2 {0}
        run: bash native/cdr-bridge/build.sh
      - name: Rust (alvo GNU)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal -c clippy -c rustfmt
          rustup default stable-x86_64-pc-windows-gnu
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Formatação
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Testes (inclui validação das fixtures contra o schema, GD-GDR-08)
        run: cargo test --workspace
      - name: Licenças das dependências
        run: node scripts/check-licenses.mjs
      - name: Instalador (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH:$(cygpath "$USERPROFILE")/.cargo/bin"
          bash scripts/package-windows.sh
      - name: Publicar instalador como artefato
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: GraphDraw-windows-setup
          path: |
            target/package/*-setup.exe
            target/package/*-setup.exe.sha256
      # GD-NF-01/02. O runner do CI não é a máquina de referência da spec
      # (i5, 16 GB), por isso o passo informa mas não bloqueia.
      - name: Desempenho (GD-NF-01, GD-NF-02)
        continue-on-error: true
        run: cargo run --release -p graphdraw-core --example bench -- --check

  linux:
    runs-on: ubuntu-latest
    env:
      GRAPHDRAW_REQUIRE_BRIDGE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libcdr-dev librevenge-dev pkg-config g++ fonts-dejavu-core \
            libxkbcommon-dev libgtk-3-dev
      - name: Ponte libcdr
        run: bash native/cdr-bridge/build.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Testes
        run: cargo test --workspace
