# Gera os ícones do programa e do arquivo .gdr a partir da logo
# (crates/graphdraw-app/assets/brand/logo-original.jpg). Fora do workspace:
#   cargo run --release --manifest-path scripts/brand-icons/Cargo.toml
[package]
name = "brand-icons"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "ico"] }

[workspace]
